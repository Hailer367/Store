name: Tailscale Runner Access

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'How long to keep the runner alive (minutes)'
        required: true
        default: '60'

jobs:
  tailscale-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tailscale
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale network
        shell: bash
        run: |
          set -euxo pipefail
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH }}" \
            --hostname="github-runner-${{ github.run_id }}" \
            --accept-routes \
            --reset \
            --timeout=30s

          for i in {1..30}; do
            RUNNER_IP="$(tailscale ip -4 2>/dev/null || true)"
            if [ -n "$RUNNER_IP" ]; then
              echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done

          echo "Tailscale IPv4 was not assigned in time"
          exit 1

      - name: Display connection details
        shell: bash
        run: |
          set -euo pipefail
          echo ""
          echo "========================================"
          echo "  RUNNER IS READY"
          echo "  Tailscale IP: $RUNNER_IP"
          echo "  Hostname: github-runner-${{ github.run_id }}"
          echo "========================================"
          echo ""
          echo "Connect via:"
          echo "  tailscale ssh runner@$RUNNER_IP"
          echo ""
          echo "Or via standard SSH:"
          echo "  ssh runner@$RUNNER_IP"

      - name: Setup SSH server
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server

          # Enable passwordless sudo for runner user
          echo "runner ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/runner-nopasswd
          sudo chmod 440 /etc/sudoers.d/runner-nopasswd

          # Start SSH
          sudo service ssh start

      - name: Keep runner alive
        shell: bash
        run: |
          set -euo pipefail
          DURATION=${{ github.event.inputs.duration_minutes }}
          END_TIME=$((SECONDS + DURATION * 60))
          
          echo "Keeping runner alive for ${DURATION} minutes..."
          echo "Cancel this workflow to terminate early."
          
          while [ "$SECONDS" -lt "$END_TIME" ]; do
            sleep 30
          done

      - name: Cleanup on exit
        if: always()
        shell: bash
        run: |
          set +e
          echo "Shutting down..."
          sudo tailscale down || true
