name: Tailscale Runner Access

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'How long to keep the runner alive (minutes)'
        required: true
        default: '60'

jobs:
  tailscale-runner:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install and start isolated Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH }}
        run: |
          # Install Tailscale (this auto-starts system tailscaled)
          curl -fsSL https://tailscale.com/install.sh | sh

          # Stop the system tailscaled that install.sh started
          sudo systemctl stop tailscaled || true
          sudo pkill tailscaled || true
          sleep 2

          # Create isolated directories for this runner instance
          RUNNER_DIR="/tmp/tailscale-runner-${GITHUB_RUN_ID}"
          mkdir -p ${RUNNER_DIR}/state
          mkdir -p ${RUNNER_DIR}/run

          # Start tailscaled with completely isolated state and socket
          sudo tailscaled \
            --statedir=${RUNNER_DIR}/state \
            --socket=${RUNNER_DIR}/run/tailscaled.sock \
            --tun=userspace-networking \
            > ${RUNNER_DIR}/tailscaled.log 2>&1 &
          
          TAILSCALED_PID=$!
          sleep 3

          # Verify the daemon started
          if ! sudo tailscale --socket=${RUNNER_DIR}/run/tailscaled.sock status &>/dev/null; then
            echo "tailscaled failed to start. Logs:"
            cat ${RUNNER_DIR}/tailscaled.log
            exit 1
          fi

          # Bring up tailscale using the isolated socket
          sudo -E tailscale \
            --socket=${RUNNER_DIR}/run/tailscaled.sock \
            up \
            --authkey=${TS_AUTHKEY} \
            --hostname=github-runner-${GITHUB_RUN_ID} \
            --accept-routes \
            --ssh

          # Wait and verify
          sleep 3
          echo "Tailscale status:"
          sudo tailscale --socket=${RUNNER_DIR}/run/tailscaled.sock status

          # Print connection info
          TAILSCALE_IP=$(sudo tailscale --socket=${RUNNER_DIR}/run/tailscaled.sock ip -4)
          echo ""
          echo "=========================================="
          echo "Runner is now on your tailnet!"
          echo "=========================================="
          echo "Tailscale IP: ${TAILSCALE_IP}"
          echo "Hostname:     github-runner-${GITHUB_RUN_ID}"
          echo ""
          echo "SSH into the runner:"
          echo "  tailscale ssh runner@${TAILSCALE_IP}"
          echo ""
          echo "Or use the hostname:"
          echo "  tailscale ssh runner@github-runner-${GITHUB_RUN_ID}"
          echo "=========================================="

          # Save PID for cleanup
          echo ${TAILSCALED_PID} > ${RUNNER_DIR}/tailscaled.pid

      - name: Setup SSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server

          # Enable passwordless sudo for runner user
          echo "runner ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/runner-nopasswd
          sudo chmod 440 /etc/sudoers.d/runner-nopasswd

          # Start SSH
          sudo service ssh start

      - name: Keep runner alive
        run: |
          DURATION=${{ github.event.inputs.duration_minutes }}
          echo "Keeping runner alive for ${DURATION} minutes..."
          echo "Cancel this workflow to terminate the runner early."
          
          for ((i=0; i<DURATION*60; i++)); do
            sleep 1
          done
