# Watcher — the full bot on GitHub-hosted runners (dry-run / paper / live).
#
# The watcher CODE repo is pinned: this workflow always clones
# Hailer367/ICU main and builds it. This file lives in Hailer367/Store
# (the runtime home) with an identical copy kept in ICU for provenance.
#
# Since §0at the watcher runs against the DEPLOYED RyoCore on Base mainnet
# (deployments/8453.json, committed): dry-run reads and simulates through
# the real contract, paper signs real transactions without broadcasting,
# live broadcasts them. Nothing here is dry-run-specific any more; dry-run
# is only the DEFAULT mode.
#
# GitHub-hosted jobs die at 6 hours: each run is one segment, segments are
# stitched by timestamp in the database (Log-Mode) or just chained (paper/
# live). Relay chaining: "segments" = N dispatches N more after this one
# (same mode), 0 = one-shot.
#
# ⚠ OPERATIONAL RULES — read before arming:
# 1. Run ONE armed instance at a time. Telegram getUpdates is polled: a
#    second watcher (this runner OR your own server) conflicts and both
#    lose messages; two live senders also race the operator nonce.
# 2. Secrets live inside an ephemeral runner VM for the job's duration.
#    The on-chain caps (50k USDC / 10 WETH) are the financial boundary —
#    keep them sized for what a leaked key could justify spending.
# 3. The owner key (RYO_OWNER_PRIVATE_KEY) is OPTIONAL: it enables the
#    §0ar Telegram admin commands during a segment. By construction it can
#    NEVER sign trades (ensure_trade_signer, §0at).
#
# Secrets (Store → Settings → Secrets and variables → Actions):
#   GIT_TOKEN                 read access to Hailer367/ICU (Contents:Read)
#   ALCHEMY_API_KEY           key → endpoints derived (like start.sh).
#                             REQUIRED unless BASE_WS_URL + BASE_HTTP_URL set.
#   BASE_WS_URL / BASE_HTTP_URL  optional free-endpoint pair (publicnode);
#                             set BOTH or NEITHER. For LIVE mode a fast,
#                             reliable RPC matters; publicnode is acceptable
#                             at the current fee floor but Alchemy is better.
#   RYO_TELEGRAM_BOT_TOKEN / RYO_TELEGRAM_CHAT_ID   notifications + control
#   TELEGRAM_ADMIN_USER_IDS   optional (blank = any chat member)
#   SUPABASE_URL / SUPABASE_KEY / SUPABASE_PREFIX   Log-Mode DB (dry-run only)
#   RYO_OPERATOR_PRIVATE_KEY  REQUIRED for paper/live; ignored in dry-run
#   RYO_OWNER_PRIVATE_KEY     optional; enables owner Telegram commands
#
# Variables: WATCH_SECONDS (default 21000), SEGMENTS (default 0),
# WATCH_HEADS ("0"/"1" override; default: OFF for dry-run — the Alchemy CU
# shape of §0ai — ON for paper/live: socket pin + head-gap detection are
# worth it when trades are real).
#
# Scheduling: NO cron. Every segment starts from an explicit
# workflow_dispatch (choose the mode there) or the relay of a chain.

name: Watcher — full program (dry-run / paper / live)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Trading mode (dry-run = never signs; paper = signs, no broadcast; live = broadcasts real trades)"
        required: false
        type: choice
        default: "dry-run"
        options: [dry-run, paper, live]
      log_mode:
        description: "Log-Mode: record every decision to Supabase (dry-run only)"
        required: false
        type: boolean
        default: true
      watch_seconds:
        description: "Segment length in seconds; default 5 h 50 min"
        required: false
        default: "21000"
      segments:
        description: "Extra segments to chain after this one (same mode; 0 = one-shot)"
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

concurrency:
  group: watcher-program
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MODE: ${{ inputs.mode || vars.WATCH_MODE || 'dry-run' }}
      LOG_MODE_IN: ${{ inputs.log_mode }}
      WATCH_SECONDS: ${{ inputs.watch_seconds || vars.WATCH_SECONDS || '21000' }}
      SEGMENTS: ${{ inputs.segments || vars.SEGMENTS || '0' }}
      WATCH_HEADS: ${{ vars.WATCH_HEADS }}
      # start.sh's production shape minus the local-sim fallback: the
      # deployed-core path (§0at).
      RYO_SOURCE: logs
      RYO_METRICS_EVERY: "1000"
      RYO_ALL_LOGS: "0"
      RYO_MANIFEST: deployments/8453.json
      BASE_WS_URL: ${{ secrets.BASE_WS_URL }}
      BASE_HTTP_URL: ${{ secrets.BASE_HTTP_URL }}
      RYO_TELEGRAM_BOT_TOKEN: ${{ secrets.RYO_TELEGRAM_BOT_TOKEN }}
      RYO_TELEGRAM_CHAT_ID: ${{ secrets.RYO_TELEGRAM_CHAT_ID }}
      RYO_TELEGRAM_ADMIN_USER_IDS: ${{ secrets.TELEGRAM_ADMIN_USER_IDS }}
      RYO_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      RYO_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      RYO_SUPABASE_PREFIX: ${{ secrets.SUPABASE_PREFIX || 'ryo_' }}
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
      # Keys enter the environment ONLY as secret references — never on a
      # command line, never in a file, never echoed.
      RYO_OPERATOR_PRIVATE_KEY: ${{ secrets.RYO_OPERATOR_PRIVATE_KEY }}
      RYO_OWNER_PRIVATE_KEY: ${{ secrets.RYO_OWNER_PRIVATE_KEY }}
      CLONE_REPO: Hailer367/ICU
      RELAY_REPO: ${{ github.repository }}

    steps:
      - name: Fetch the watcher source (REST tarball of the pinned repo)
        run: |
          set -euo pipefail
          curl -sSL -H "Authorization: Bearer $GIT_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${CLONE_REPO}/tarball/main" -o /tmp/src.tgz
          mkdir -p "$RUNNER_TEMP/repo"
          tar -xzf /tmp/src.tgz --strip-components=1 -C "$RUNNER_TEMP/repo"
          rm -f /tmp/src.tgz
          test -f "$RUNNER_TEMP/repo/Watcher/Cargo.toml"
          echo "source tree ready"
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/repo/Watcher

      - name: Build the watcher (release)
        working-directory: ${{ runner.temp }}/repo/Watcher
        run: cargo build --release

      - name: Preflight — mode, manifest, keys, endpoint (no network)
        working-directory: ${{ runner.temp }}/repo/Watcher
        run: |
          set -euo pipefail
          case "$MODE" in dry-run|paper|live) ;; *) echo "::error::invalid mode '$MODE'"; exit 1;; esac
          for v in RYO_TELEGRAM_BOT_TOKEN RYO_TELEGRAM_CHAT_ID; do
            if [ -z "${!v:-}" ]; then echo "::error::secret $v is not configured"; exit 1; fi
          done
          # The DEPLOYED core is required now: no --local-sim fallback path.
          test -f "$RYO_MANIFEST" || { echo "::error::$RYO_MANIFEST missing (deployments/8453.json must be committed)"; exit 1; }
          if [ "$MODE" != "dry-run" ] && [ -z "${RYO_OPERATOR_PRIVATE_KEY:-}" ]; then
            echo "::error::$MODE needs the RYO_OPERATOR_PRIVATE_KEY secret (the owner key can never trade — by construction)"; exit 1
          fi
          # Log-Mode: dry-run feature (the binary refuses it otherwise).
          LOG_MODE=0
          if [ "$MODE" = "dry-run" ] && { [ "$LOG_MODE_IN" = "true" ] || [ -z "$LOG_MODE_IN" ]; }; then
            for v in RYO_SUPABASE_URL RYO_SUPABASE_KEY; do
              if [ -z "${!v:-}" ]; then echo "::error::Log-Mode needs the $v secret"; exit 1; fi
            done
            LOG_MODE=1
          fi
          echo "LOG_MODE=$LOG_MODE" >> "$GITHUB_ENV"
          echo "RYO_LOG_MODE=$LOG_MODE" >> "$GITHUB_ENV"
          if [ -n "${BASE_WS_URL:-}" ] || [ -n "${BASE_HTTP_URL:-}" ]; then
            if [ -z "${BASE_WS_URL:-}" ] || [ -z "${BASE_HTTP_URL:-}" ]; then
              echo "::error::BASE_WS_URL and BASE_HTTP_URL must be set together"; exit 1
            fi
          elif [ -z "${ALCHEMY_API_KEY:-}" ]; then
            echo "::error::no endpoint: set ALCHEMY_API_KEY or BASE_WS_URL + BASE_HTTP_URL"; exit 1
          fi
          case "$WATCH_SECONDS" in (*[!0-9]*|'') echo "::error::WATCH_SECONDS must be a number"; exit 1;; esac
          case "$SEGMENTS" in (*[!0-9]*|'') echo "::error::segments must be a number"; exit 1;; esac
          ./target/release/ryo-watch --help >/dev/null
          echo "preflight OK: mode=$MODE log_mode=$LOG_MODE"

      - name: Run one segment (chosen mode)
        working-directory: ${{ runner.temp }}/repo/Watcher
        run: |
          set -uo pipefail
          # exit 124 = timeout fired = the segment ran its FULL length: success.
          set +e
          if [ -n "${BASE_WS_URL:-}" ]; then
            export RYO_WS_RPC="$BASE_WS_URL"
            export RYO_HTTP_RPC="$BASE_HTTP_URL"
            echo "endpoint: custom (free provider — zero Alchemy CU)"
          else
            export RYO_WS_RPC="wss://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
            export RYO_HTTP_RPC="https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
            echo "endpoint: Alchemy (derived from key)"
          fi
          # Heads: ON for trading modes (socket pin, head-gap rescue);
          # OFF for dry-run by default (the ~1.4 M CU/h metronome, §0ai).
          if [ "$MODE" = "dry-run" ]; then
            if [ "${WATCH_HEADS:-}" = "1" ]; then RYO_NO_HEADS=0; else RYO_NO_HEADS=1; fi
          else
            if [ "${WATCH_HEADS:-}" = "0" ]; then RYO_NO_HEADS=1; else RYO_NO_HEADS=0; fi
          fi
          export RYO_NO_HEADS
          echo "mode: ${MODE} | heads: $([ "$RYO_NO_HEADS" = "1" ] && echo OFF || echo ON) | log-mode: ${RYO_LOG_MODE} | core: ${RYO_MANIFEST}"
          timeout -s TERM --kill-after 90 "${WATCH_SECONDS}" \
            ./target/release/ryo-watch \
              --ws-rpc "$RYO_WS_RPC" --http-rpc "$RYO_HTTP_RPC" \
              --manifest "$RYO_MANIFEST" \
              --mode "$MODE" \
              --source logs \
              watch --show-empty --metrics-every "${RYO_METRICS_EVERY}" \
            2>&1 | tee "$RUNNER_TEMP/watch.log"
          ec=${PIPESTATUS[0]}
          if [ "$ec" -eq 124 ]; then ec=0; fi
          echo "WATCH_EXIT=$ec" >> "$GITHUB_ENV"
          exit "$ec"

      - name: Relay — start the next segment now (opt-in chain)
        # Runs BEFORE the log upload so the successor runner boots while this
        # one tidies. The chain preserves the chosen MODE — a live program
        # never silently degrades to dry-run (or the reverse).
        if: always() && env.SEGMENTS != '0'
        run: |
          set -euo pipefail
          if [ "${WATCH_EXIT:-1}" -ne 0 ]; then
            echo "watcher exited with ${WATCH_EXIT:-<unset>}; not relaying (a broken build should not chain)"
            exit 0
          fi
          NEXT=$(( SEGMENTS - 1 ))
          if [ "$NEXT" -lt 0 ]; then NEXT=0; fi
          echo "relay: dispatching next ${MODE} segment (remaining after it: ${NEXT})"
          printf '{"ref":"%s","inputs":{"mode":"%s","log_mode":"%s","watch_seconds":"%s","segments":"%s"}}' \
            "$REF" "$MODE" "$LOG_MODE_IN" "$WATCH_SECONDS" "$NEXT" \
            | gh api "repos/${RELAY_REPO}/actions/workflows/watcher-dryrun.yml/dispatches" --input -
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}

      - name: Upload segment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-segment-${{ github.run_number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/watch.log
          if-no-files-found: warn

      - name: Summary (no secrets, ever)
        if: always()
        run: |
          {
            echo "## Watcher segment #${{ github.run_number }} — mode \`${MODE}\`"
            echo ""
            echo "- core: deployed RyoCore via \`deployments/8453.json\` (no local-sim path)"
            echo "- exit handling: \`timeout -s TERM\` -> graceful drain (\`runs\` stop row on Log-Mode runs)"
            grep -o 'events=[0-9]* scans=[0-9]* skipped=[0-9]* failed=[0-9]*' "$RUNNER_TEMP/watch.log" | tail -1 | sed 's/^/- counters: `/' | sed 's/$/`/' || true
            grep -aoE 'opportunities=[0-9]+' "$RUNNER_TEMP/watch.log" | tail -1 | sed 's/^/- found: /' || true
            grep -ao 'reason="[^"]*"' "$RUNNER_TEMP/watch.log" | tail -1 | sed 's/^/- stop: /' || true
            echo "- relay: segments remaining was \`${SEGMENTS}\`; chain keeps mode \`${MODE}\`"
            echo "- verdicts (won/lost/real dollars) are NOT written by the bot: the audit replays the DB offline"
          } >> "$GITHUB_STEP_SUMMARY"
